<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="manifest" href="manifest.json" />
  <title>Wydatki miesięczne</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#121316" />

  <!-- Google Font: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #101216;
      --card-bg: #1a1d24;
      --card-border: #282c37;
      --text-main: #f0f2f5;
      --text-muted: #8b949e;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 18px 16px 40px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      padding: 10px 4px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 40%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-settings-icon {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 12px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .btn-settings-icon:active {
      transform: scale(0.92);
      background: #252a35;
    }

    /* Karta kategorii */
    .category-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cat-icon {
      font-size: 1.4rem;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cat-info h3 {
      font-size: 1rem;
      font-weight: 600;
      word-break: break-word;
    }

    .cat-info span {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .row-right {
      text-align: right;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .remaining-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .remaining-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .remaining-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--success);
    }

    .remaining-val.warning {
      color: var(--warning);
    }

    .remaining-val.danger {
      color: var(--danger);
    }

    .btn-add {
      background: var(--accent);
      color: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
      flex-shrink: 0;
    }

    .btn-add:active {
      transform: scale(0.92);
      background: #2563eb;
    }

    /* Pasek postępu */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 100%;
      background: var(--success);
      border-radius: 99px;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px dashed var(--card-border);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Przycisk resetu */
    .btn-reset {
      margin-top: 14px;
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-reset:active {
      background: rgba(239, 68, 68, 0.22);
      transform: scale(0.98);
    }

    /* Modale */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: flex-end;
      z-index: 999;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #1e222b;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 32px;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.5);
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-box h2 {
      font-size: 1.2rem;
      margin-bottom: 14px;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 16px 45px 16px 16px;
      border-radius: 14px;
      background: #14171d;
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: var(--accent);
    }

    .input-wrapper .suffix {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: #14171d;
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-modal {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .btn-confirm {
      background: var(--accent);
      color: white;
    }

    /* Sekcje w Ustawieniach */
    .settings-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 18px 0 8px;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #14171d;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .settings-item-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-delete-cat {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-delete-cat:active {
      transform: scale(0.92);
      background: rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Wydatki miesięczne</h1>
      <button class="btn-settings-icon" onclick="openSettingsModal()" aria-label="Ustawienia">⚙️</button>
    </header>

    <div id="categories-container" style="display: flex; flex-direction: column; gap: 12px;"></div>

    <button class="btn-reset" onclick="resetLimits()">
      Resetuj wydane kwoty
    </button>
  </div>

  <!-- Modal do wpisywania wydatku -->
  <div class="modal-backdrop" id="expense-modal">
    <div class="modal-box">
      <h2 id="modal-title">Dodanie kwoty: </h2>

      <div class="input-wrapper">
        <input 
          type="number" 
          id="expense-amount" 
          step="0.01" 
          inputmode="decimal" 
          placeholder="0.00" 
        />
        <span class="suffix">zł</span>
      </div>

      <div class="modal-actions">
        <button class="btn-modal btn-cancel" onclick="closeExpenseModal()">Anuluj</button>
        <button class="btn-modal btn-confirm" onclick="applyExpense()">Zatwierdź</button>
      </div>
    </div>
  </div>

  <!-- Modal Ustawień (zarządzanie kategoriami i limitami) -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-box">
      <h2>Ustawienia wydatków</h2>

      <div class="settings-section-title">Dodaj nowy wydatek</div>
      <div class="form-group">
        <label>Nazwa wydatku</label>
        <input type="text" id="new-cat-name" class="form-input" placeholder="np. Paliwo, Rozrywka" maxlength="30" />
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 2;">
          <label>Limit (zł)</label>
          <input type="number" id="new-cat-limit" class="form-input" step="0.01" inputmode="decimal" placeholder="np. 500" />
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Ikonka</label>
          <input type="text" id="new-cat-icon" class="form-input" placeholder="np. ⛽" maxlength="2" />
        </div>
      </div>

      <button class="btn-modal btn-confirm" style="width: 100%; margin-top: 4px;" onclick="addNewCategory()">+ Dodaj wydatek</button>

      <div class="settings-section-title">Aktualne pozycje</div>
      <div class="settings-list" id="settings-categories-list"></div>

      <div class="modal-actions" style="margin-top: 20px;">
        <button class="btn-modal btn-cancel" onclick="closeSettingsModal()">Zamknij</button>
      </div>
    </div>
  </div>

  <script>
    // --- OBSŁUGA PLIKÓW COOKIES ---
    function setCookie(name, value, days = 365) {
      const date = new Date();
      date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
      const expires = "expires=" + date.toUTCString();
      document.cookie = `${name}=${encodeURIComponent(JSON.stringify(value))};${expires};path=/;SameSite=Lax`;
    }

    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      if (match) {
        try {
          return JSON.parse(decodeURIComponent(match[2]));
        } catch (e) {
          console.error("Błąd parsowania ciasteczka:", e);
          return null;
        }
      }
      return null;
    }

    // --- DOMYŚLNE DANE DLA NOWEGO UŻYTKOWNIKA ---
    const DEFAULT_CATEGORIES = [
      { id: "jedzenie", name: "Jedzenie", icon: "🍔", limit: 1000 },
      { id: "dojazdy", name: "Dojazdy", icon: "🚌", limit: 250 },
      { id: "studia", name: "Studia", icon: "🎓", limit: 800 },
      { id: "mieszkanie", name: "Mieszkanie", icon: "🏠", limit: 800 },
      { id: "inne", name: "Inne", icon: "📦", limit: 500 }
    ];

    // Pobieranie stanu z Cookies
    let categories = getCookie("app_categories") || DEFAULT_CATEGORIES;
    let spentData = getCookie("app_spent_data") || {};
    let activeCatId = null;

    function saveState() {
      setCookie("app_categories", categories);
      setCookie("app_spent_data", spentData);
      render();
    }

    // Renderowanie kafelków
    function render() {
      const container = document.getElementById("categories-container");
      container.innerHTML = "";

      if (categories.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            Brak zdefiniowanych wydatków.<br>
            Kliknij ikonkę <b>⚙️</b> w prawym górnym rogu, aby dodać swój pierwszy wydatek i limit.
          </div>
        `;
        return;
      }

      categories.forEach(cat => {
        const spent = spentData[cat.id] || 0;
        const remaining = cat.limit - spent;
        const percentLeft = cat.limit > 0 ? Math.max(0, Math.min(100, (remaining / cat.limit) * 100)) : 0;

        let statusClass = "";
        let barColor = "var(--success)";
        if (remaining <= 0) {
          statusClass = "danger";
          barColor = "var(--danger)";
        } else if (remaining < cat.limit * 0.25) {
          statusClass = "warning";
          barColor = "var(--warning)";
        }

        const card = document.createElement("div");
        card.className = "category-row";
        card.innerHTML = `
          <div class="row-top">
            <div class="row-left">
              <div class="cat-icon">${cat.icon || "💳"}</div>
              <div class="cat-info">
                <h3>${escapeHtml(cat.name)}</h3>
                <span>Limit: ${cat.limit.toFixed(2).replace(".00", "")} zł</span>
              </div>
            </div>
            <div class="row-right">
              <div class="remaining-box">
                <span class="remaining-label">Zostało</span>
                <span class="remaining-val ${statusClass}">${remaining.toFixed(2).replace(".00", "")} zł</span>
              </div>
              <button class="btn-add" onclick="openExpenseModal('${cat.id}')">+</button>
            </div>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${percentLeft}%; background-color: ${barColor};"></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- MODAL DODAWANIA WYDATKU ---
    function openExpenseModal(catId) {
      activeCatId = catId;
      const cat = categories.find(c => c.id === catId);
      if (!cat) return;
      document.getElementById("modal-title").textContent = `Dodanie kwoty: ${cat.name}`;
      
      const input = document.getElementById("expense-amount");
      input.value = "";
      document.getElementById("expense-modal").classList.add("open");
      setTimeout(() => input.focus(), 80);
    }

    function closeExpenseModal() {
      document.getElementById("expense-modal").classList.remove("open");
      activeCatId = null;
    }

    function applyExpense() {
      const input = document.getElementById("expense-amount");
      const val = parseFloat(input.value.replace(",", "."));

      if (!isNaN(val) && val > 0 && activeCatId) {
        spentData[activeCatId] = (spentData[activeCatId] || 0) + val;
        saveState();
        closeExpenseModal();
      } else {
        input.focus();
      }
    }

    document.getElementById("expense-amount").addEventListener("keydown", (e) => {
      if (e.key === "Enter") applyExpense();
    });

    // --- MODAL USTAWIEŃ (DODAWANIE / USUWANIE KATEGORII) ---
    function openSettingsModal() {
      renderSettingsList();
      document.getElementById("settings-modal").classList.add("open");
    }

    function closeSettingsModal() {
      document.getElementById("settings-modal").classList.remove("open");
      // Wyczyszczenie formularza
      document.getElementById("new-cat-name").value = "";
      document.getElementById("new-cat-limit").value = "";
      document.getElementById("new-cat-icon").value = "";
    }

    function renderSettingsList() {
      const listContainer = document.getElementById("settings-categories-list");
      listContainer.innerHTML = "";

      if (categories.length === 0) {
        listContainer.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem; padding: 6px 0;">Brak pozycji.</div>`;
        return;
      }

      categories.forEach(cat => {
        const item = document.createElement("div");
        item.className = "settings-item";
        item.innerHTML = `
          <div class="settings-item-info">
            <span style="font-size: 1.2rem;">${cat.icon || "💳"}</span>
            <div>
              <strong style="font-size: 0.95rem;">${escapeHtml(cat.name)}</strong>
              <div style="font-size: 0.75rem; color: var(--text-muted);">Limit: ${cat.limit} zł</div>
            </div>
          </div>
          <button class="btn-delete-cat" onclick="deleteCategory('${cat.id}')" title="Usuń pozycję">🗑️</button>
        `;
        listContainer.appendChild(item);
      });
    }

    function addNewCategory() {
      const nameInput = document.getElementById("new-cat-name");
      const limitInput = document.getElementById("new-cat-limit");
      const iconInput = document.getElementById("new-cat-icon");

      const name = nameInput.value.trim();
      const limit = parseFloat(limitInput.value.replace(",", "."));
      const icon = iconInput.value.trim() || "💳";

      if (!name) {
        alert("Podaj nazwę wydatku.");
        nameInput.focus();
        return;
      }

      if (isNaN(limit) || limit <= 0) {
        alert("Podaj poprawny limit (kwotę większą od 0).");
        limitInput.focus();
        return;
      }

      const newId = "cat_" + Date.now();
      categories.push({
        id: newId,
        name: name,
        icon: icon,
        limit: limit
      });

      saveState();
      renderSettingsList();

      // Czyszczenie pól po dodaniu
      nameInput.value = "";
      limitInput.value = "";
      iconInput.value = "";
    }

    function deleteCategory(catId) {
      const cat = categories.find(c => c.id === catId);
      const catName = cat ? cat.name : "tę kategorię";

      if (confirm(`Czy na pewno chcesz usunąć "${catName}"?`)) {
        categories = categories.filter(c => c.id !== catId);
        delete spentData[catId];
        saveState();
        renderSettingsList();
      }
    }

    function resetLimits() {
      if (confirm("Czy na pewno chcesz wyzerować wszystkie wydane kwoty w tym miesiącu?")) {
        spentData = {};
        saveState();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Zamknięcie modali przy kliknięciu w tło
    window.addEventListener("click", (e) => {
      if (e.target.id === "expense-modal") closeExpenseModal();
      if (e.target.id === "settings-modal") closeSettingsModal();
    });

    // Start
    render();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
